<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 780" width="1560" role="img" aria-labelledby="t d"><title id="t">FlowchartVisualizerExtension の構成</title><desc id="d">3 つの IDE(VS Code・Visual Studio・Rider)が、それぞれ固有の方法でコードの制御構造を読み、共通の中間表現 FlowchartIR に変換する。IR は core/ の共有部品(差分・全体階層・Mermaid 変換)を通り、3 ホストで同じ共有 Webview バンドルが描く。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1560" height="780" fill="var(--bg)"/><rect width="1560" height="780" fill="url(#g)"/><rect x="40" y="100" width="300" height="600" rx="14" fill="var(--f-gray)" stroke="var(--gray)" stroke-width="1.5"/><rect x="62" y="90" width="143.2" height="20" fill="var(--bg)"/><text class="glabel mono" x="68" y="104.5" style="fill:var(--gray)">HOSTS — 抽出はホスト固有</text><rect x="400" y="100" width="320" height="600" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="422" y="90" width="126.79999999999998" height="20" fill="var(--bg)"/><text class="glabel mono" x="428" y="104.5" style="fill:var(--teal)">CORE — 共有の中間表現</text><rect x="780" y="100" width="400" height="600" rx="14" fill="var(--f-blue)" stroke="var(--blue)" stroke-width="1.5"/><rect x="802" y="90" width="192.39999999999998" height="20" fill="var(--bg)"/><text class="glabel mono" x="808" y="104.5" style="fill:var(--blue)">WEBVIEW — 3 ホスト共通のバンドル</text><rect x="1240" y="100" width="280" height="600" rx="14" fill="var(--f-orange)" stroke="var(--orange)" stroke-width="1.5"/><rect x="1262" y="90" width="118.6" height="20" fill="var(--bg)"/><text class="glabel mono" x="1268" y="104.5" style="fill:var(--orange)">OUTPUT — 書き出し</text><path class="a primary" d="M222.0 220.0 L370.0 220.0 L370.0 400.0 L528.0 400.0"/><path class="h primary" d="M528.0 400.0 L517.0 394.5 L517.0 405.5 Z"/><path class="a primary" d="M222.0 400.0 L370.0 400.0"/><path class="h primary" d="M370.0 400.0 L359.0 394.5 L359.0 405.5 Z"/><path class="a primary" d="M222.0 580.0 L370.0 580.0 L370.0 400.0"/><path class="h primary" d="M370.0 400.0 L364.5 411.0 L375.5 411.0 Z"/><path class="a secondary" d="M592.0 400.0 L670.0 400.0 L670.0 220.0 L592.0 220.0"/><path class="h secondary" d="M592.0 220.0 L603.0 225.5 L603.0 214.5 Z"/><path class="a secondary" d="M670.0 400.0 L670.0 580.0 L592.0 580.0"/><path class="h secondary" d="M592.0 580.0 L603.0 585.5 L603.0 574.5 Z"/><path class="a primary" d="M592.0 400.0 L750.0 400.0 L948.0 400.0"/><path class="h primary" d="M948.0 400.0 L937.0 394.5 L937.0 405.5 Z"/><path class="a primary" d="M750.0 400.0 L750.0 220.0 L948.0 220.0"/><path class="h primary" d="M948.0 220.0 L937.0 214.5 L937.0 225.5 Z"/><path class="a primary" d="M1012.0 220.0 L1210.0 220.0 L1210.0 260.0 L1348.0 260.0"/><path class="h primary" d="M1348.0 260.0 L1337.0 254.5 L1337.0 265.5 Z"/><path class="a primary" d="M1012.0 400.0 L1348.0 400.0"/><path class="h primary" d="M1348.0 400.0 L1337.0 394.5 L1337.0 405.5 Z"/><path class="a secondary" d="M750.0 400.0 L750.0 740.0 L1210.0 740.0 L1210.0 540.0 L1348.0 540.0"/><path class="h secondary" d="M1348.0 540.0 L1337.0 534.5 L1337.0 545.5 Z"/><rect class="card" x="158.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(170.0 200.0) scale(1.000)"><path d="M9 13h8a4 4 0 1 1 8 0h6v8a4 4 0 1 0 0 8v5H9z"/></g><rect class="card" x="158.0" y="368.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(170.0 380.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><rect class="card" x="158.0" y="548.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(170.0 560.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="528.0" y="368.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(540.0 380.0) scale(1.000)"><circle cx="10" cy="8" r="4"/><circle cx="10" cy="32" r="4"/><circle cx="30" cy="16" r="4"/><path d="M10 12v16M30 20c0 6-8 6-18 9"/></g><rect class="card" x="528.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(540.0 200.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><rect class="card" x="528.0" y="548.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(540.0 560.0) scale(1.000)"><path d="M4 10a3 3 0 0 1 3-3h8l4 5h14a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></g><rect class="card" x="948.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(960.0 200.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M4 15h32"/><circle class="fill" cx="9" cy="11" r="1.2"/><circle class="fill" cx="13.5" cy="11" r="1.2"/></g><rect class="card" x="948.0" y="368.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(960.0 380.0) scale(1.000)"><path d="M14 11h22M14 20h22M14 29h22"/><circle class="fill" cx="7" cy="11" r="2"/><circle class="fill" cx="7" cy="20" r="2"/><circle class="fill" cx="7" cy="29" r="2"/></g><rect class="card" x="948.0" y="548.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(960.0 560.0) scale(1.000)"><path d="M3 21h8l4-12 6 24 5-16 3 4h8"/></g><rect class="card" x="1348.0" y="228.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1360.0 240.0) scale(1.000)"><path d="M10 4h14l8 8v24H10z"/><path d="M24 4v8h8M15 20h12M15 26h12M15 32h8"/></g><rect class="card" x="1348.0" y="368.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1360.0 380.0) scale(1.000)"><rect x="6" y="5" width="28" height="30" rx="3"/><path d="M6 13h28M6 27h28M13 5v30M27 5v30"/></g><rect class="card" x="1348.0" y="508.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1360.0 520.0) scale(1.000)"><path d="M7 17v6M12.5 11v18M18 6v28M23.5 13v14M29 9v22M34 16v8"/></g><text class="title" x="190" y="272.0">VS Code(TypeScript)</text><text class="sub mono" x="190" y="291.0">DocumentSymbol + 括弧の走査</text><text class="sub mono" x="190" y="306.0">(シンボル無しなら tree-sitter)</text><text class="title" x="190" y="452.0">Visual Studio(C#)</text><text class="sub mono" x="190" y="471.0">Roslyn ControlFlowGraph</text><text class="sub mono" x="190" y="486.0">→ SyntaxWalker</text><text class="title" x="190" y="632.0">Rider(Kotlin)</text><text class="sub mono" x="190" y="651.0">Java PSI(C# は未対応)</text><text class="title" x="560" y="452.0">FlowchartIR</text><text class="sub mono" x="560" y="471.0">nodes・edges</text><text class="sub mono" x="560" y="486.0">sourceFile・generatedAt</text><text class="title" x="560" y="272.0">diff/ir-diff.ts</text><text class="sub mono" x="560" y="291.0">LCS で HEAD と比べる</text><text class="sub mono" x="560" y="306.0">(追加・削除・変更)</text><text class="title" x="560" y="632.0">architecture/</text><text class="sub mono" x="560" y="651.0">CodeBoarding の analysis.json</text><text class="sub mono" x="560" y="666.0">→ 全体 › ファイル › 関数</text><text class="title" x="980" y="272.0">bridge.js</text><text class="sub mono" x="980" y="291.0">メッセージ・書き出し・ジャンプ</text><text class="title" x="980" y="452.0">views.js</text><text class="sub mono" x="980" y="471.0">フロー / 呼び出し / 状態</text><text class="sub mono" x="980" y="486.0">(純粋関数・UMD)</text><text class="title" x="980" y="632.0">motion.js・viewport.js</text><text class="sub mono" x="980" y="651.0">動き・パン・ズーム・ミニマップ</text><text class="title" x="1380" y="312.0">Mermaid</text><text class="sub mono" x="1380" y="331.0">flowchart TD(テキスト)</text><text class="title" x="1380" y="452.0">SVG / PNG</text><text class="sub mono" x="1380" y="471.0">表示中のビューを画像に</text><text class="title" x="1380" y="592.0">魔方陣(エンタメ)</text><text class="sub mono" x="1380" y="611.0">別リポジトリの入力 JSON</text><rect class="lab" x="376.9" y="379.0" width="124.2" height="16" rx="3"/><text class="alabel mono blue" x="439.0" y="391.0">FlowchartIR に変換</text><rect class="lab" x="630.5" y="289.0" width="79.0" height="16" rx="3"/><text class="alabel mono " x="670.0" y="301.0">HEAD と比較</text><rect class="lab" x="601.5" y="569.0" width="59.0" height="16" rx="3"/><text class="alabel mono " x="631.0" y="581.0">全体階層</text><rect class="lab" x="638.0" y="379.0" width="66.1" height="16" rx="3"/><text class="alabel mono blue" x="671.0" y="391.0">IR を渡す</text><rect class="lab" x="1132.2" y="379.0" width="95.7" height="16" rx="3"/><text class="alabel mono blue" x="1180.0" y="391.0">表示中のビュー</text><rect class="lab" x="932.2" y="719.0" width="95.7" height="16" rx="3"/><text class="alabel mono " x="980.0" y="731.0">別のエミッター</text><text class="hd" x="40" y="44" text-anchor="start">FlowchartVisualizerExtension — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。読む側(抽出)はホスト固有、IR と描画は共有</text></svg>
