<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'self';"
    />
    <title>Flowchart</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1e1e1e;
      }
      #chart {
        width: 100%;
        height: 100%;
        overflow: auto;
        box-sizing: border-box;
        padding: 12px;
      }
      #chart svg {
        max-width: none;
      }
      #error {
        display: none;
        margin: 12px;
        padding: 8px 12px;
        border: 1px solid #d32f2f;
        background: #fdecea;
        color: #611a15;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="error"></div>
    <div id="chart"></div>

    <!-- CDN不使用: mermaid.min.js はローカル同梱(core/scripts/fetch-mermaid.js でnode_modulesから複製) -->
    <script src="./mermaid.min.js"></script>
    <script src="./bridge.js"></script>
  </body>
</html>
